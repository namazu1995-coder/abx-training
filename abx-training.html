<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>抗菌薬選択トレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root{
    --bg:#F4F6FA;
    --surface:#FFFFFF;
    --surface-2:#E9EDF5;
    --ink:#151E30;
    --ink-soft:#48566E;
    --ink-faint:#54627A;
    --line:#DCE2ED;
    --primary:#1E4C8C;
    --primary-strong:#123566;
    --primary-tint:#E4ECF9;
    --accent:#9C5E12;
    --accent-tint:#FBEDDA;
    --good:#2E7D4F;
    --good-tint:#E4F3EA;
    --warn:#9C5E12;
    --warn-tint:#FBEDDA;
    --bad:#B23A3A;
    --bad-tint:#FBE7E5;
    --shadow: 0 1px 2px rgba(21,30,48,.06), 0 6px 20px rgba(21,30,48,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A1322;
      --surface:#111F35;
      --surface-2:#17263F;
      --ink:#EAF0FA;
      --ink-soft:#A9B9D2;
      --ink-faint:#8195B4;
      --line:#243A5C;
      --primary:#6FA8E8;
      --primary-strong:#9CC4F2;
      --primary-tint:#152A49;
      --accent:#E3A45D;
      --accent-tint:#33260F;
      --good:#6FC796;
      --good-tint:#16301F;
      --warn:#E3A45D;
      --warn-tint:#33260F;
      --bad:#E27C7C;
      --bad-tint:#3A1B1B;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1322;
    --surface:#111F35;
    --surface-2:#17263F;
    --ink:#EAF0FA;
    --ink-soft:#A9B9D2;
    --ink-faint:#8195B4;
    --line:#243A5C;
    --primary:#6FA8E8;
    --primary-strong:#9CC4F2;
    --primary-tint:#152A49;
    --accent:#E3A45D;
    --accent-tint:#33260F;
    --good:#6FC796;
    --good-tint:#16301F;
    --warn:#E3A45D;
    --warn-tint:#33260F;
    --bad:#E27C7C;
    --bad-tint:#3A1B1B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.65;
  }
  h1,h2,h3,.disp{
    font-family:"Zen Kaku Gothic New","BIZ UDPGothic",system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .back{
    appearance:none; border:none; background:transparent; color:var(--primary);
    font-size:15px; font-weight:700; cursor:pointer; padding:6px 8px 6px 0;
    display:flex; align-items:center; gap:2px; min-height:44px;
    font-family:inherit;
  }
  .topbar .title{
    font-size:15px; font-weight:700; color:var(--ink-soft);
    letter-spacing:.02em;
    flex:1;
    text-align:center;
    margin-right:34px;
  }
  main{flex:1; padding:0 18px 48px;}

  /* ---------- HOME ---------- */
  .hero{ padding:28px 4px 18px; }
  .hero .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--primary);
    text-transform:uppercase;
  }
  .hero h1{ font-size:25px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1.4; }
  .hero p{ color:var(--ink-soft); font-size:14px; margin-top:10px; max-width:44ch; }

  .progress-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin:14px 0 8px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px;
  }
  .progress-text{flex:1;}
  .progress-text .num{font-size:13px; font-weight:700; color:var(--ink);}
  .progress-text .sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  .review-pill-btn{
    appearance:none; border:1px solid var(--warn); background:var(--warn-tint); color:var(--warn);
    font-weight:700; font-size:12.5px; padding:8px 14px; border-radius:999px; cursor:pointer;
    white-space:nowrap; font-family:inherit;
    min-height:44px; display:inline-flex; align-items:center;
  }

  .principles-cta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--primary-tint); border:1px solid var(--primary); border-radius:16px;
    padding:14px 18px; margin:10px 0 24px; cursor:pointer;
    width:100%; text-align:left; font-family:inherit; appearance:none;
  }
  .principles-cta .t{display:block; font-size:14px; font-weight:700; color:var(--primary-strong);}
  .principles-cta .s{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .principles-cta .arrow{color:var(--primary-strong); font-size:18px; flex:none;}

  .section-head{ display:flex; align-items:baseline; gap:8px; margin:26px 0 12px; }
  .section-head h2{font-size:15px; font-weight:700; color:var(--ink);}
  .section-head .count{font-size:12px; color:var(--ink-faint); font-weight:400;}

  .case-grid{ display:flex; flex-direction:column; gap:10px; }
  .case-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px; cursor:pointer; text-align:left; width:100%;
    box-shadow:var(--shadow); font-family:inherit;
    appearance:none;
  }
  .case-card:active{ transform:scale(.99); }
  .case-num{
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:13px;
    color:var(--ink-faint); width:26px; flex:none; font-variant-numeric:tabular-nums;
  }
  .case-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .case-body .tag{ font-size:11px; font-weight:700; color:var(--primary); }
  .case-body .hint{
    font-size:14px; font-weight:600; color:var(--ink); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .status-chip{
    flex:none; align-self:flex-start; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .status-chip.none{ background:var(--surface-2); color:var(--ink-faint); }
  .status-chip.good{ background:var(--good-tint); color:var(--good); }
  .status-chip.partial{ background:var(--warn-tint); color:var(--warn); }
  .status-chip.poor{ background:var(--bad-tint); color:var(--bad); }

  .empty-review{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px; }

  /* ---------- CASE VIEW ---------- */
  .case-hero{ padding:22px 0 4px; }
  .case-hero .tag{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.08em; text-transform:uppercase;}
  .case-hero h1{ font-size:20px; font-weight:900; margin-top:8px; }
  .vignette{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-top:16px; box-shadow:var(--shadow); font-size:14.5px; color:var(--ink);
  }
  .vitals-line{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .vitals-line b{color:var(--ink); font-weight:700;}

  .prompt-block{ margin-top:22px; }
  .prompt-block label{
    display:block; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:8px; line-height:1.5;
  }
  .prompt-block label .n{ color:var(--primary); margin-right:6px; }
  .prompt-block .q-focus{ font-size:11.5px; color:var(--ink-faint); margin:-2px 0 8px; line-height:1.5; }
  .prompt-block textarea{
    width:100%; min-height:88px; resize:vertical; border-radius:12px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:12px 14px; font-family:inherit; font-size:16px; line-height:1.6;
  }
  .prompt-block textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .prompt-block textarea::placeholder{ color:var(--ink-faint); }

  .reveal-btn{
    width:100%; margin-top:24px; appearance:none; border:none; cursor:pointer;
    background:var(--primary); color:#fff; font-weight:700; font-size:15px;
    padding:15px; border-radius:14px; font-family:inherit;
    box-shadow:0 4px 14px rgba(30,76,140,.28);
    min-height:44px;
  }
  .reveal-btn:active{ transform:scale(.99); }

  .answer-wrap{ margin-top:28px; }

  .answer-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .answer-card h3{
    font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .answer-card h3 .ico{
    width:22px;height:22px;border-radius:7px;flex:none; display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:900; color:#fff;
  }
  .ico.check{background:var(--primary);}
  .ico.sum{background:var(--accent);}
  .answer-card ul{ margin:0; padding-left:20px; font-size:14px; color:var(--ink); }
  .answer-card li{ margin-bottom:6px; }
  .answer-card li:last-child{ margin-bottom:0; }
  mark{
    background:var(--accent-tint); color:var(--accent); padding:1px 5px; border-radius:5px;
    font-weight:700; box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }
  .mistake-box{
    margin-top:12px; padding:10px 14px; border-radius:10px;
    background:var(--bad-tint); color:var(--bad); font-size:12.5px; line-height:1.6;
  }
  .mistake-box b{ display:block; font-size:11.5px; font-weight:700; margin-bottom:4px; letter-spacing:.04em; }
  .mistake-box ul{ margin:0; padding-left:18px; color:var(--bad); }
  .refs-box{
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:12px; color:var(--ink-faint);
  }
  .refs-box b{ display:block; font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:6px; letter-spacing:.04em; }
  .refs-box ol{ margin:0; padding-left:18px; color:var(--ink-faint); }
  .refs-box li{ margin-bottom:6px; line-height:1.55; }
  .refs-box li:last-child{ margin-bottom:0; }
  .refs-box .ref-source{ color:var(--ink-faint); }
  .refs-box a{ color:var(--ink-soft); word-break:break-all; }

  .assess-block{ margin-top:26px; }
  .assess-block .q{ font-size:14px; font-weight:700; margin-bottom:12px; text-align:center; }
  .assess-row{ display:flex; gap:8px; }
  .assess-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:13px 6px;
    font-family:inherit; font-size:12.5px; font-weight:700; line-height:1.4;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
    min-height:44px;
  }
  .assess-btn.good{ border-color:var(--good); }
  .assess-btn.partial{ border-color:var(--warn); }
  .assess-btn.poor{ border-color:var(--bad); }
  .assess-btn.good.active{ background:var(--good); color:#fff; }
  .assess-btn.partial.active{ background:var(--warn); color:#fff; }
  .assess-btn.poor.active{ background:var(--bad); color:#fff; }
  .save-warning{
    margin-top:12px; padding:10px 14px; border-radius:10px;
    background:var(--bad-tint); color:var(--bad); font-size:12.5px; font-weight:600; line-height:1.5;
  }

  .after-assess{
    margin-top:22px; display:flex; flex-direction:column; gap:10px;
    animation:fadein .3s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .nav-btn{
    appearance:none; border:none; cursor:pointer; border-radius:12px; padding:14px;
    font-family:inherit; font-size:14.5px; font-weight:700; text-align:center;
    min-height:44px;
  }
  .nav-btn.primary{ background:var(--primary); color:#fff; }
  .nav-btn.ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }

  /* ---------- PRINCIPLES VIEW ---------- */
  .principles-hero{ padding:24px 0 6px; }
  .principles-hero .eyebrow{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.1em; text-transform:uppercase;}
  .principles-hero h1{ font-size:21px; font-weight:900; margin-top:8px; }
  .principles-hero p{ font-size:13.5px; color:var(--ink-soft); margin-top:8px; }

  .escalation-note{
    margin-top:18px; padding:16px 18px; border-radius:14px;
    background:var(--accent-tint); border:1.5px solid var(--accent);
  }
  .escalation-note .en-label{
    font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--accent); text-transform:uppercase;
  }
  .escalation-note .en-body{ font-size:13.5px; color:var(--ink); margin-top:6px; line-height:1.6; }
  .escalation-note .en-body ul{ margin:6px 0 0; padding-left:18px; }
  .escalation-note .en-body li{ margin-bottom:4px; }

  .flow{ margin-top:22px; position:relative; }
  .flow-step{ display:flex; gap:14px; position:relative; padding-bottom:22px; }
  .flow-step:last-child{ padding-bottom:0; }
  .flow-step .rail{ display:flex; flex-direction:column; align-items:center; flex:none; }
  .flow-step .node{
    width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px;
    font-family:"Zen Kaku Gothic New",sans-serif; flex:none; z-index:1;
  }
  .flow-step .stem{ width:2px; flex:1; background:var(--line); margin-top:2px; }
  .flow-step .content{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); margin-top:1px;}
  .flow-step .content h3{ font-size:14.5px; font-weight:700; }
  .flow-step .content p{ font-size:13px; color:var(--ink-soft); margin-top:5px; }

  .principles-foot{
    margin-top:26px; padding:16px 18px; background:var(--primary-tint); border-radius:14px;
    font-size:13px; color:var(--primary-strong); text-align:center; font-weight:700;
  }

  /* --- spectrum table --- */
  .sp-legend{ display:flex; flex-wrap:wrap; gap:14px; margin:14px 0; }
  .sp-legend-item{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-faint); }
  .sp-swatch{ width:16px; height:12px; border-radius:3px; border:1px solid var(--line); flex:none; }
  .sp-swatch.sp-full{ background:var(--primary); border-color:var(--primary); }
  .sp-swatch.sp-partial{
    background:repeating-linear-gradient(45deg, var(--primary), var(--primary) 2px, var(--surface) 2px, var(--surface) 5px);
    border-color:var(--primary);
  }
  .sp-scroll{
    overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:8px;
    border:1px solid var(--line); border-radius:14px; background:var(--surface);
  }
  .sp-table{ border-collapse:collapse; font-size:11.5px; white-space:nowrap; }
  .sp-table th, .sp-table td{ border:1px solid var(--line); padding:6px 8px; }
  .sp-corner{
    position:sticky; left:0; z-index:3; background:var(--surface-2);
    text-align:left; font-size:11px; color:var(--ink-faint); min-width:150px;
  }
  .sp-group-head{ background:var(--primary-tint); color:var(--primary-strong); font-weight:700; text-align:center; }
  .sp-col-head{ background:var(--surface-2); color:var(--ink-soft); font-weight:600; text-align:center; }
  .sp-cls-row td{
    background:var(--accent-tint); color:var(--accent); font-weight:700;
    font-size:11px; padding:5px 8px; border-left:none; border-right:none;
  }
  .sp-drug-head{
    position:sticky; left:0; z-index:2; background:var(--surface); text-align:left; font-weight:600;
    color:var(--ink); box-shadow:1px 0 0 var(--line);
  }
  .sp-cell{ text-align:center; min-width:34px; }
  .sp-bar{ display:inline-block; width:100%; height:14px; border-radius:4px; }
  .sp-cell.sp-full .sp-bar{ background:var(--primary); }
  .sp-cell.sp-partial .sp-bar{
    background:repeating-linear-gradient(45deg, var(--primary), var(--primary) 2px, transparent 2px, transparent 5px);
    border:1px solid var(--primary);
  }
  .sp-note-row td{
    position:static; background:var(--surface-2); color:var(--ink-faint); font-size:11px;
    font-weight:400; white-space:normal; padding:6px 10px;
  }

  a{color:var(--primary);}
  button:focus-visible, textarea:focus-visible, .case-card:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }

  @media (hover:hover){
    .case-card:hover{ border-color:var(--primary); }
    .principles-cta:hover{ background:var(--primary-tint); filter:brightness(0.97); }
    .review-pill-btn:hover{ filter:brightness(0.95); }
    .reveal-btn:hover{ filter:brightness(1.08); }
    .assess-btn:hover{ border-color:var(--primary); }
    .nav-btn.primary:hover{ filter:brightness(1.08); }
    .nav-btn.ghost:hover{ border-color:var(--primary); }
    .topbar .back:hover{ text-decoration:underline; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  "use strict";

  var CASES = [
    {
      id:"cap", num:1, tag:"呼吸器感染症",
      hint:"82歳男性・独居・発熱と湿性咳嗽",
      vignette:"82歳男性。独居でADLは自立しており、施設入所歴・長期臥床はない。基礎疾患は高血圧のみ。直近3か月以内の抗菌薬使用歴はない。3日前からの発熱、湿性咳嗽、労作時息切れが出現し改善なく救急受診した。",
      data:"BP 104/62　HR 108　RR 26　SpO2 88%(room air)→酸素2L/分で95%　T 38.9℃　意識清明／BUN 24mg/dL　WBC 14200/μL　CRP 18.6mg/dL／胸部X線: 右下肺野に浸潤影",
      questions:[
        {
          q:"A-DROPを用いてこの患者の重症度を評価せよ。外来/入院/ICUのどこで治療すべきか判断せよ。",
          focus:"A-DROPの各項目の判定 ・ 治療の場の決定基準",
          answer:[
            "A-DROPの5項目を確認する: <mark>Age(男性70歳以上)該当</mark>、<mark>BUN 24mg/dL(21超)で該当</mark>、<mark>SpO2 88%(90%未満)で該当</mark>、意識障害なし(非該当)、収縮期血圧104mmHg(90未満でないため非該当)",
            "該当項目は<mark>3項目=重症</mark>に分類される",
            "重症(3項目該当)は入院治療が原則。<mark>4〜5項目該当やショックを伴う場合はICU入室を考慮</mark>する基準であり、本症例は3項目のため一般病棟入院の上で頻回のバイタル・呼吸状態の再評価を行う"
          ],
          mistakes:["発熱・咳嗽・浸潤影という古典的な所見だけで軽症/重症を判断し、A-DROPの各項目を実際に数えない","SpO2低値を「酸素投与で95%まで改善したから問題ない」と過小評価し、投与前の値で重症度評価をやり直さない"]
        },
        {
          q:"想定される主要な起因菌とその推定根拠を述べよ。細菌性肺炎とマイコプラズマ肺炎はどう鑑別するか。",
          focus:"想定される起因菌 ・ 細菌性/マイコプラズマの鑑別法",

  var STORE_KEY = "abx_progress_v1";

  function loadProgress(){
    try{
      var p = JSON.parse(localStorage.getItem(STORE_KEY));
      return (p && typeof p === "object" && !Array.isArray(p)) ? p : {};
    }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); return true; }catch(e){ return false; }
  }
  function loadDrafts(){
    try{
      var d = JSON.parse(localStorage.getItem(DRAFT_KEY));
      if(!d || typeof d !== "object" || Array.isArray(d)) return {};
      var clean = {};
      Object.keys(d).forEach(function(caseId){
        var entry = d[caseId];
        if(!entry || typeof entry !== "object" || Array.isArray(entry)) return;
        var cleanEntry = {};
        Object.keys(entry).forEach(function(k){
          if(typeof entry[k] === "string") cleanEntry[k] = entry[k];
        });
        clean[caseId] = cleanEntry;
      });
      return clean;
    }catch(e){ return {}; }
  }
  function saveDrafts(d){
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); return true; }catch(e){ return false; }
  }

  (function validateCasesData(){
    var seenIds = {}, seenNums = {}, ok = true;
    CASES.forEach(function(c, i){
      if(!c.id || !c.tag || !c.hint || !c.vignette || !c.data) ok = false;
      if(seenIds[c.id]) ok = false;
      seenIds[c.id] = true;
      if(seenNums[c.num]) ok = false;
      seenNums[c.num] = true;
      if(c.num !== i+1) ok = false;
      if(!c.questions || c.questions.length === 0) ok = false;
      c.questions && c.questions.forEach(function(q){
        if(!q.q) ok = false;
        if(!q.answer || q.answer.length === 0) ok = false;
        if(!q.mistakes) ok = false;
      });
      if(!c.summary || !c.summary.points || c.summary.points.length === 0) ok = false;
      if(c.summary && c.summary.refs){
        c.summary.refs.forEach(function(r){
          if(!r.title) ok = false;
          if(r.url && r.url.indexOf("http") !== 0) ok = false;
        });
      }
    });
    if(!ok && typeof console !== "undefined" && console.warn){
      console.warn("[abx] CASES data integrity check failed: ids/nums are not unique/sequential, a case is missing a required field, a question has no text/answer, a case is missing summary points, or a reference is missing its title / has a malformed url.");
    }
  })();

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  var VALID_STATUSES = ["good","partial","poor"];
  function safeStatus(s){
    return VALID_STATUSES.indexOf(s) !== -1 ? s : "none";
  }

  function statusLabel(s){
    if(s==="good") return "自力で言えた";
    if(s==="partial") return "一部抜けた";
    if(s==="poor") return "ほぼ言えなかった";
    return "未挑戦";
  }

  function caseById(id){
    for(var i=0;i<CASES.length;i++){ if(CASES[i].id===id) return CASES[i]; }
    return null;
  }

  function completedCount(){
    var n=0;
    for(var i=0;i<CASES.length;i++){ if(safeStatus(state.progress[CASES[i].id]) !== "none") n++; }
    return n;
  }
  function reviewCases(){
    return CASES.filter(function(c){
      var s = state.progress[c.id];
      return s === "partial" || s === "poor";
    });
  }

  function go(view, caseId){
    state.view = view;
    state.caseId = caseId || null;
    render();
    window.scrollTo(0,0);
  }

    }

    html += '<div class="hero">';
    html += '  <div class="eyebrow">初期研修医のためのエンピリック抗菌薬選択</div>';

    html += '  <p>暗記ではなく、判断プロセスの訓練です。答えを見る前に、各設問への自分の考えを書き出してみましょう。</p>';

  function caseCardHtml(c){
    var status = safeStatus(state.progress[c.id]);
    var numStr = (c.num<10?"0":"")+c.num;
    return '<button class="case-card" data-action="open-case" data-id="'+c.id+'">'+
      '<span class="case-num">'+numStr+'</span>'+
      '<span class="case-body"><span class="tag">'+c.tag+'</span><span class="hint">'+c.hint+'</span></span>'+
      '<span class="status-chip '+status+'">'+statusLabel(status)+'</span>'+
    '</button>';
  }

  /* ---------------- RENDER: CASE ---------------- */
  var revealCache = {}; // caseId -> bool (revealed) — session-only
  var draftCache = loadDrafts(); // caseId -> {q0,q1,...} — persisted, debounced
  var pendingStatus = {}; // caseId -> chosen status this session

  function renderCase(c){
    var html = "";
    html += '<div class="case-hero"><div class="tag">症例 '+(c.num<10?"0":"")+c.num+'・'+c.tag+'</div><h1>'+c.hint+'</h1></div>';
    html += '<div class="vignette">'+c.vignette+'<div class="vitals-line"><b>データ　</b>'+c.data+'</div></div>';

    var revealed = !!revealCache[c.id];
    var drafts = draftCache[c.id] || {};

    html += '<div id="prompts">';
    c.questions.forEach(function(qq, i){
      var key = "q"+i;
      var taId = "ta-"+c.id+"-"+i;
      html += '<div class="prompt-block">';
      html += '<label for="'+taId+'"><span class="n">Q'+(i+1)+'.</span>'+qq.q+'</label>';
      if(!revealed){
        if(qq.focus){ html += '<div class="q-focus">観点: '+qq.focus+'</div>'; }
        html += '<textarea id="'+taId+'" data-field="'+key+'" placeholder="自分の考えを書いてみましょう…">'+ (drafts[key] ? escapeHtml(drafts[key]) : "") +'</textarea>';
      }
      html += '</div>';
      if(revealed){
        html += answerCard(i+1, qq);
      }
    });
    html += '</div>';

    if(draftSaveFailed){
      html += '<div class="save-warning">⚠ この端末には保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。書いた内容はこの画面を離れると失われます。</div>';
    }

    if(!revealed){
      html += '<button class="reveal-btn" data-action="reveal">模範解答を見る</button>';
    } else {
      html += renderAnswer(c);
    }

    return html;
  }

  function renderAnswer(c){
    var html = '<div class="answer-wrap">';
    html += summaryCard(c.summary);
    html += '</div>';

    html += '<div class="assess-block">';
    html += '<div class="q">自分の答えと照らし合わせて、自己評価しましょう</div>';
    var cur = pendingStatus[c.id] || state.progress[c.id] || "";
    html += '<div class="assess-row">';
    html += assessBtn("good","自力で言えた", cur);
    html += assessBtn("partial","一部抜けた", cur);
    html += assessBtn("poor","ほぼ言えなかった", cur);
    html += '</div>';
    if(cur && lastSaveFailed){
      html += '<div class="save-warning">⚠ この端末には保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。この記録はこの画面を離れると失われます。</div>';
    }
    html += '</div>';

    if(cur){
      html += '<div class="after-assess">';
      html += '<button class="nav-btn primary" data-action="next-case">次の症例へ</button>';
      html += '<button class="nav-btn ghost" data-action="goto-home">一覧に戻る</button>';
      html += '</div>';
    }

    return html;
  }

  function answerCard(n, qq){
    var html = '<div class="answer-card"><h3><span class="ico check">'+n+'</span>設問'+n+'の考え方</h3>';
    html += '<ul>'+qq.answer.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul>';
    if(qq.mistakes && qq.mistakes.length){
      html += '<div class="mistake-box"><b>よくある誤答</b><ul>'+qq.mistakes.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></div>';
    }
    html += '</div>';
    return html;
  }

  function summaryCard(summary){
    var html = '<div class="answer-card"><h3><span class="ico sum">✓</span>症例のまとめ</h3>';
    html += '<ul>'+summary.points.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul>';
    if(summary.refs && summary.refs.length){
      html += '<div class="refs-box"><b>参考文献</b><ol>'+summary.refs.map(refItemHtml).join("")+'</ol></div>';
    }
    html += '</div>';
    return html;
  }

  function refItemHtml(ref){
    var cite = ref.authors ? (ref.authors + '. ') : "";
    cite += ref.title + '.';
    if(ref.source || ref.year){
      cite += ' <span class="ref-source">' + [ref.source, ref.year].filter(Boolean).join(', ') + '.</span>';
    }
    var link = ref.url ? ' <a href="'+ref.url+'" target="_blank" rel="noopener noreferrer">'+ref.url+'</a>' : "";
    return '<li>' + cite + link + '</li>';
  }

  function assessBtn(kind, label, cur){
    return '<button class="assess-btn '+kind+(cur===kind?' active':'')+'" data-action="assess" data-kind="'+kind+'">'+label+'</button>';
  }

  /* ---------------- RENDER: PRINCIPLES ---------------- */
  function renderPrinciples(){
    var html = "";
    html += '<div class="principles-hero"><div class="eyebrow">エンピリック抗菌薬選択の思考フレームワーク</div><h1>どの症例でも、まずこの順番で考える</h1><p>個々の薬剤名を覚えるより先に、この7ステップを体に染み込ませましょう。</p></div>';
    html += '<div class="escalation-note"><div class="en-label">🚩 抗菌薬選択より先に、絶対に見逃してはいけない疾患</div><div class="en-body">'+
      'これらを疑ったら、抗菌薬を何にするか考える前に、まず該当する初動(画像検査・穿刺・緊急コンサルトなど)を進める。<ul>'+
      NEVER_MISS.map(function(f){ return '<li><mark>'+f.t+'</mark>: '+f.d+'</li>'; }).join('') +
      '</ul></div></div>';
    html += '<div class="flow">';
    PRINCIPLES.forEach(function(f,i){
      html += '<div class="flow-step">';
      html += '<div class="rail"><div class="node">'+(i+1)+'</div>'+(i<PRINCIPLES.length-1?'<div class="stem"></div>':'')+'</div>';
      html += '<div class="content"><h3>'+f.t+'</h3><p>'+f.d+'</p></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="escalation-note"><div class="en-label">✋ 抗菌薬を急がない/不要なことが多い状況</div><div class="en-body">'+
      'ステップ6で「本当に今すぐ抗菌薬が必要か」を考える際の代表例。感染症らしさが乏しければ、まず経過観察や原因の再検討を優先してよい。<ul>'+
      SKIP_ABX.map(function(f){ return '<li><mark>'+f.t+'</mark>: '+f.d+'</li>'; }).join('') +
      '</ul></div></div>';
    html += '<div class="escalation-note"><div class="en-label">⚡ 治療経過が良くないとき</div><div class="en-body">'+
      'ステップ7の4パラメータで「効いていない」と判断したら、次の3つを順に見直す。<ul>'+
      '<li><mark>ソースコントロール不良</mark>: 膿瘍や見落としている感染巣はないか(感染性心内膜炎の疣贅、生体内デバイスのバイオフィルム、骨髄炎、前立腺炎、結石・腫瘍による胆管/尿管閉塞など)。ドレナージや造影CT・心エコーによる熱源検索を検討する</li>'+
      '<li><mark>原因微生物を適切にカバーできていない</mark>: 投与中の抗菌薬が感受性検査で「R」になっていないか、投与量は足りているかを確認する</li>'+
      '<li><mark>そもそも感染症ではない可能性</mark>: 腫瘍熱、膠原病、薬剤熱、偽痛風など非感染性の病態を再検討する</li>'+
      '</ul>次のような場面では<mark>自己判断で選択・継続を決めず</mark>、早めに上級医/感染症科へ相談する。<ul>'+
      '<li>重症度評価やソースコントロールの必要性・タイミングに迷うとき</li>'+
      '<li>アレルギー歴の解釈(側鎖の類似性など)に自信が持てないとき</li>'+
      '<li>腎機能・肝機能に応じた用量調整に自信が持てないとき</li>'+
      '<li>治療開始48〜72時間で反応が乏しい、または状態が悪化するとき</li>'+
      '<li>耐性菌(ESBL産生菌・AmpC過剰産生菌・MRSAなど)が検出されたとき</li>'+
      '</ul></div></div>';
    html += '<div class="principles-foot">迷ったら、この7つに立ち返る。</div>';
    return html;
  }

  /* ---------------- RENDER: SPECTRUM ---------------- */
  function spectrumCellHtml(v){
    if(v==="f") return '<td class="sp-cell sp-full"><span class="sp-bar"></span></td>';
    if(v==="p") return '<td class="sp-cell sp-partial"><span class="sp-bar"></span></td>';
    return '<td class="sp-cell"></td>';
  }

  function renderSpectrum(){
    var html = "";
    html += '<div class="principles-hero"><div class="eyebrow">主要抗菌薬スペクトラム早見表</div><h1>薬剤ごとのカバー範囲を一覧で確認</h1><p>個々の薬剤の名前と用量を覚えるより先に、「この薬は何をカバーし、何をカバーしないか」の大枠をつかむための概略図です。実際の選択は感染部位・重症度・培養結果・施設のアンチバイオグラムで調整してください。</p></div>';
    html += '<div class="sp-legend">'+
      '<span class="sp-legend-item"><span class="sp-swatch sp-full"></span>一般的な活性</span>'+
      '<span class="sp-legend-item"><span class="sp-swatch sp-partial"></span>条件付き/菌種・感受性による</span>'+
      '<span class="sp-legend-item"><span class="sp-swatch"></span>経験的カバーとして扱わない</span>'+
      '</div>';
    html += '<div class="sp-scroll"><table class="sp-table"><thead>';
    html += '<tr class="sp-group-row"><th class="sp-corner" rowspan="2">分類 / 薬剤</th>';
    SPECTRUM_GROUPS.forEach(function(grp){ html += '<th class="sp-group-head" colspan="'+grp.cols.length+'">'+grp.g+'</th>'; });
    html += '</tr><tr>';
    SPECTRUM_GROUPS.forEach(function(grp){ grp.cols.forEach(function(col){ html += '<th class="sp-col-head">'+col.l+'</th>'; }); });
    html += '</tr></thead><tbody>';
    var lastCls = null;
    SPECTRUM_DRUGS.forEach(function(d){
      if(d.cls !== lastCls){
        var totalCols = 1;
        SPECTRUM_GROUPS.forEach(function(grp){ totalCols += grp.cols.length; });
        html += '<tr class="sp-cls-row"><td colspan="'+totalCols+'">'+d.cls+'</td></tr>';
        lastCls = d.cls;
      }
      html += '<tr><th class="sp-drug-head">'+d.name+'</th>';
      SPECTRUM_GROUPS.forEach(function(grp){ grp.cols.forEach(function(col){ html += spectrumCellHtml((d.cov||{})[col.k]); }); });
      html += '</tr>';
      if(d.note){
        var totalCols2 = 1;
        SPECTRUM_GROUPS.forEach(function(grp){ totalCols2 += grp.cols.length; });
        html += '<tr class="sp-note-row"><td colspan="'+totalCols2+'">'+d.note+'</td></tr>';
      }
    });
    html += '</tbody></table></div>';
    html += '<div class="principles-foot">AST=薬剤感受性試験、IE=感染性心内膜炎、NVE=自己弁感染性心内膜炎。教育用の概略図であり、投与量・臓器移行性・耐性機序・施設内感受性は別途確認すること。</div>';
    return html;
  }

  /* ---------------- MASTER RENDER ---------------- */
  function render(){
    var topbarHtml, mainHtml;

    if(state.view==="home"){
      topbarHtml = state.reviewOnly
        ? '<button class="back" data-action="goto-home-full">‹ 一覧</button><div class="title">復習リスト</div>'
        : '<div class="title">抗菌薬選択トレーニング</div>';
      mainHtml = renderHome();
    } else if(state.view==="case"){
      var c = caseById(state.caseId);
      if(!c){
        state.view = "home";
        state.caseId = null;
        return render();
      }
      var numStr = (c.num<10?"0":"")+c.num;
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">症例 '+numStr+'</div>';
      mainHtml = renderCase(c);
    } else if(state.view==="principles"){
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">抗菌薬選択の思考フレームワーク</div>';
      mainHtml = renderPrinciples();
    } else if(state.view==="spectrum"){
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">抗菌薬スペクトラム早見表</div>';
      mainHtml = renderSpectrum();
    }

    app.innerHTML = '<div class="topbar">'+topbarHtml+'</div><main>'+mainHtml+'</main>';
    bindEvents();
  }

  /* ---------------- EVENTS ---------------- */
  function nextCaseAfter(current){
    var pool = state.reviewOnly ? reviewCases() : CASES;
    if(pool.length === 0){ pool = CASES; }
    var idx = -1;
    for(var i=0;i<pool.length;i++){ if(pool[i].id===current.id){ idx = i; break; } }
    return idx === -1 ? pool[0] : pool[(idx+1) % pool.length];
  }

  function bindEvents(){
    app.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-action");
        if(action==="open-case"){
          revealCache[el.getAttribute("data-id")] = false;
          delete pendingStatus[el.getAttribute("data-id")];
          lastSaveFailed = false;
          draftSaveFailed = false;
          go("case", el.getAttribute("data-id"));
        } else if(action==="goto-home"){
          go("home");
        } else if(action==="goto-home-full"){
          state.reviewOnly = false;
          render();
        } else if(action==="toggle-review"){
          state.reviewOnly = true;
          render();
        } else if(action==="goto-principles"){
          go("principles");
        } else if(action==="goto-spectrum"){
          go("spectrum");
        } else if(action==="reveal"){
          collectDraft(state.caseId, true);
          revealCache[state.caseId] = true;
          render();
          var firstAnswer = app.querySelector(".answer-card");
          if(firstAnswer) firstAnswer.scrollIntoView({behavior:"smooth", block:"start"});
        } else if(action==="assess"){
          var kind = el.getAttribute("data-kind");
          var c0 = caseById(state.caseId);
          if(!c0) return;
          pendingStatus[state.caseId] = kind;
          state.progress[state.caseId] = kind;
          lastSaveFailed = !saveProgress(state.progress);
          render();
        } else if(action==="next-case"){
          var c = caseById(state.caseId);
          if(!c) return;
          var next = nextCaseAfter(c);
          revealCache[next.id] = false;
          delete pendingStatus[next.id];
          go("case", next.id);
        }
      });
    });

    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      ta.addEventListener("input", function(){
        collectDraft(state.caseId, false);
      });
    });
  }

  var draftSaveTimer = null;
  var draftSaveFailed = false;

  function persistDrafts(){
    var onDisk = loadDrafts();
    var merged = {};
    Object.keys(onDisk).forEach(function(id){ merged[id] = onDisk[id]; });
    Object.keys(draftCache).forEach(function(id){ merged[id] = draftCache[id]; });
    draftSaveFailed = !saveDrafts(merged);
    return merged;
  }

  function collectDraft(caseId, flushNow){
    var d = {};
    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      d[ta.getAttribute("data-field")] = ta.value;
    });
    draftCache[caseId] = d;
    if(draftSaveTimer){ clearTimeout(draftSaveTimer); draftSaveTimer = null; }
    if(flushNow){
      persistDrafts();
    } else {
      draftSaveTimer = setTimeout(persistDrafts, 400);
    }
  }
  window.addEventListener("pagehide", persistDrafts);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") persistDrafts();
  });

  render();
})();
</script>
</body>
</html>
